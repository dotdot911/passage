name: Passage
options:
  bundleIdPrefix: com.passage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${PASSAGE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ProxyCore:
    path: Packages/ProxyCore
targets:
  Passage:
    type: application
    platform: iOS
    # Xcode 26 builds AppIcon from AppIcon.icon (Liquid Glass plus flat iOS 17-18 fallbacks) and ignores the same-named appiconset.
    sources:
      - App/Sources
      - App/Assets.xcassets
      - App/AppIcon.icon
      - App/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passage.io
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/Passage.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Passage
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        KeychainAccessGroup: $(AppIdentifierPrefix)com.passage.io.shared
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
          - GeistMono-Bold.ttf
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTTP Archive
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.passage.io.har]
          - CFBundleTypeName: Charles Session
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.passage.io.chlsj]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.passage.io.har
            UTTypeDescription: HTTP Archive
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [har]
          - UTTypeIdentifier: com.passage.io.chlsj
            UTTypeDescription: Charles Session
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [chlsj]
    entitlements:
      path: App/Passage.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.passage.io]
        keychain-access-groups: [$(AppIdentifierPrefix)com.passage.io.shared]
    dependencies:
      - target: PacketTunnel
      - package: ProxyCore
        products: [Storage, IPC, CertKit, ProxyModel, Viewing, Rules, Archive, Scripting]
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passage.io.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Passage Tunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        KeychainAccessGroup: $(AppIdentifierPrefix)com.passage.io.shared
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.passage.io]
        keychain-access-groups: [$(AppIdentifierPrefix)com.passage.io.shared]
    dependencies:
      - package: ProxyCore
        products: [TunnelCore, HTTPEngine, Rules, Storage, IPC, CertKit, ProxyModel, Scripting]
